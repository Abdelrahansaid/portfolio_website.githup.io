<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Teams repost flow</title>
  <desc id="d">A conversation in one Teams channel is moved to another team and channel through three steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14202c"/>
      <stop offset="1" stop-color="#1f3a4f"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18bfef"/></marker>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- source channel -->
    <rect x="80" y="200" width="320" height="400" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="240" y="250" font-size="26" font-weight="700" fill="#ffffff">Original channel</text>
    <rect x="116" y="285" width="248" height="70" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="136" y="305" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="136" y="327" width="190" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="148" y="378" width="216" height="52" rx="12" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="164" y="396" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="148" y="446" width="216" height="52" rx="12" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="164" y="464" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <text x="240" y="560" font-size="20" fill="#ffffff" fill-opacity="0.7">post + replies + images</text>

    <!-- flow -->
    <line x1="410" y1="400" x2="520" y2="400" stroke="#18bfef" stroke-width="4" marker-end="url(#ar)"/>
    <rect x="530" y="290" width="220" height="220" rx="110" fill="#18bfef"/>
    <text x="640" y="385" font-size="34" font-weight="700" fill="#0d1b26">Repost</text>
    <text x="640" y="425" font-size="34" font-weight="700" fill="#0d1b26">flow</text>
    <g font-size="20" fill="#ffffff" fill-opacity="0.8">
      <text x="640" y="560">1 Team · 2 Channel · 3 Subject</text>
    </g>
    <line x1="760" y1="400" x2="870" y2="400" stroke="#18bfef" stroke-width="4" marker-end="url(#ar)"/>

    <!-- target channel -->
    <rect x="880" y="200" width="320" height="400" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#18bfef" stroke-opacity="0.8" stroke-width="2"/>
    <text x="1040" y="250" font-size="26" font-weight="700" fill="#ffffff">Target channel</text>
    <rect x="916" y="285" width="248" height="70" rx="12" fill="#18bfef" fill-opacity="0.3"/>
    <rect x="936" y="305" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="936" y="327" width="190" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="948" y="378" width="216" height="52" rx="12" fill="#18bfef" fill-opacity="0.2"/>
    <rect x="964" y="396" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="948" y="446" width="216" height="52" rx="12" fill="#18bfef" fill-opacity="0.2"/>
    <rect x="964" y="464" width="110" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
    <text x="1040" y="560" font-size="20" fill="#ffffff" fill-opacity="0.7">author · date · images kept</text>
  </g>
</svg>
