<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Quality evaluation dashboard illustration</title>
  <desc id="d">An abstract Power BI style dashboard with KPI tiles, a weekly bar chart, a donut chart and a matrix. It contains no real data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14202c"/>
      <stop offset="1" stop-color="#1f3a4f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- dashboard canvas -->
  <rect x="80" y="70" width="1120" height="660" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <text x="124" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Quality Evaluation</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <rect x="880" y="102" width="64" height="40" rx="20" fill="#18bfef"/><text x="912" y="130" fill="#0d1b26">W1</text>
    <rect x="956" y="102" width="64" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/><text x="988" y="130" fill="#ffffff">W2</text>
    <rect x="1032" y="102" width="64" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/><text x="1064" y="130" fill="#ffffff">W3</text>
    <rect x="1108" y="102" width="64" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/><text x="1140" y="130" fill="#ffffff">W4</text>
  </g>

  <!-- KPI tiles -->
  <g fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2">
    <rect x="124" y="170" width="320" height="120" rx="16"/>
    <rect x="480" y="170" width="320" height="120" rx="16"/>
    <rect x="836" y="170" width="320" height="120" rx="16"/>
  </g>
  <g>
    <rect x="152" y="198" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="152" y="232" width="160" height="30" rx="8" fill="#18bfef"/>
    <rect x="508" y="198" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="508" y="232" width="120" height="30" rx="8" fill="#7bd8f2"/>
    <rect x="864" y="198" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="864" y="232" width="190" height="30" rx="8" fill="#18bfef" fill-opacity="0.75"/>
  </g>

  <!-- bar chart -->
  <g>
    <rect x="124" y="320" width="520" height="380" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="152" y="346" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
    <line x1="156" y1="640" x2="612" y2="640" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="180" y="500" width="64" height="140" rx="8" fill="#18bfef"/>
    <rect x="288" y="440" width="64" height="200" rx="8" fill="#18bfef" fill-opacity="0.85"/>
    <rect x="396" y="470" width="64" height="170" rx="8" fill="#18bfef" fill-opacity="0.7"/>
    <rect x="504" y="400" width="64" height="240" rx="8" fill="#7bd8f2"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">
      <text x="212" y="672">W1</text><text x="320" y="672">W2</text><text x="428" y="672">W3</text><text x="536" y="672">W4</text>
    </g>
  </g>

  <!-- donut -->
  <g>
    <rect x="680" y="320" width="220" height="380" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="704" y="346" width="100" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
    <circle cx="790" cy="500" r="68" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="28"/>
    <circle cx="790" cy="500" r="68" fill="none" stroke="#18bfef" stroke-width="28" stroke-dasharray="260 428" transform="rotate(-90 790 500)"/>
    <circle cx="790" cy="500" r="68" fill="none" stroke="#7bd8f2" stroke-width="28" stroke-dasharray="90 428" stroke-dashoffset="-270" transform="rotate(-90 790 500)"/>
    <rect x="712" y="620" width="156" height="10" rx="5" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="712" y="646" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- matrix -->
  <g>
    <rect x="936" y="320" width="220" height="380" rx="16" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="960" y="346" width="100" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
    <g fill="#ffffff" fill-opacity="0.22">
      <rect x="960" y="392" width="172" height="34" rx="8"/><rect x="960" y="440" width="172" height="34" rx="8"/>
      <rect x="960" y="488" width="172" height="34" rx="8"/><rect x="960" y="536" width="172" height="34" rx="8"/>
      <rect x="960" y="584" width="172" height="34" rx="8"/><rect x="960" y="632" width="172" height="34" rx="8"/>
    </g>
    <g fill="#18bfef">
      <rect x="1000" y="403" width="110" height="12" rx="6"/><rect x="1000" y="451" width="84" height="12" rx="6"/>
      <rect x="1000" y="499" width="96" height="12" rx="6"/><rect x="1000" y="547" width="58" height="12" rx="6"/>
      <rect x="1000" y="595" width="72" height="12" rx="6"/><rect x="1000" y="643" width="44" height="12" rx="6"/>
    </g>
  </g>
</svg>
